<!-- Search popup, opened from the home page search bar, Ctrl/Cmd+K or / -->
<div class="modal fade search-modal" id="searchModal" tabindex="-1" role="dialog" aria-label="Search mental models" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="search-input-row">
        <span class="fa fa-search" aria-hidden="true"></span>
        <input type="search" id="search-input" class="search-input" role="combobox" aria-expanded="false" placeholder="Search mental models" autocomplete="off" spellcheck="false" aria-label="Search mental models" aria-controls="search-results" aria-autocomplete="list">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close search">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
      <div id="search-status" class="sr-only" aria-live="polite"></div>
      <div class="search-footer d-none d-md-flex">
        <span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> to move</span>
        <span><kbd>Enter</kbd> to open</span>
        <span><kbd>Esc</kbd> to close</span>
      </div>
    </div>
  </div>
</div>
